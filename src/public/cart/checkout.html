  <body
    :class="{'overflow-hidden': isNavbarOpen, 'overflow-y-auto': !isNavbarOpen}"
  >
    <div
      class="fixed inset-0 flex flex-col w-full h-full items-center justify-center bg-gray-50 dark:bg-gray-900 z-50 space-y-4"
    >
      <div
        class="loader w-16 h-16 border-t-4 border-blue-500 border-solid rounded-full animate-spin"
      ></div>
      <p class="text-gray-700 dark:text-gray-200 text-lg">Loading...</p>
    </div>

    <div class="bg-gray-50 dark:bg-gray-900 main-content">
      <div id="headerContainer"></div>

      <div id="modalContainer"></div>

      <!-- You need focus-trap.js to make the modal accessible -->
      <script src="../assets/js/focus-trap.js" defer></script>

      <!--Home-->
      <div
        class="flex items-center min-h-screen px-6 bg-gray-50 dark:bg-gray-900"
      >
        <div
          class="w-full mt-32 mb-8 flex flex-col items-center justify-center"
        >
          <div class="text-center">
            <h1
              class="title font-manrope font-bold text-4xl leading-10 mb-8 text-center text-gray-800 dark:text-gray-100"
            >
              Checkout
            </h1>
          </div>
          <div
            class="max-w-7xl mx-auto rounded-3xl border-2 border-gray-200 dark:border-gray-600 p-4 lg:p-8"
          >
            <div class="grid lg:grid-cols-3 gap-8 mt-12">
              <div class="lg:col-span-2">
                <h3 class="text-xl font-bold text-gray-600 dark:text-gray-300">
                  Choose your payment method
                </h3>
                <div class="grid gap-4 sm:grid-cols-2 mt-6">
                  <div class="flex items-center">
                    <input
                      type="radio"
                      class="w-5 h-5 cursor-pointer"
                      id="card"
                      checked
                    />
                    <label for="card" class="ml-4 flex gap-2 cursor-pointer">
                      <img
                        src="https://readymadeui.com/images/visa.webp"
                        class="w-12"
                        alt="card1"
                      />
                      <img
                        src="https://readymadeui.com/images/american-express.webp"
                        class="w-12"
                        alt="card2"
                      />
                      <img
                        src="https://readymadeui.com/images/master.webp"
                        class="w-12"
                        alt="card3"
                      />
                    </label>
                  </div>
                  <div class="flex items-center">
                    <input
                      type="radio"
                      class="w-5 h-5 cursor-pointer"
                      id="paypal"
                    />
                    <label for="paypal" class="ml-4 flex gap-2 cursor-pointer">
                      <img
                        src="https://readymadeui.com/images/paypal.webp"
                        class="w-20"
                        alt="paypalCard"
                      />
                    </label>
                  </div>
                </div>
                <form class="mt-8 lg:mb-24">
                  <div class="grid gap-6">
                    <div class="grid sm:grid-cols-3 gap-6">
                      <div class="relative text-gray-500">
                        <input
                          type="number"
                          placeholder="Card number"
                          class="block w-full pl-10 mt-1 placeholder-gray-400 border-gray-300 rounded-md shadow-sm focus:border-primary-300 focus:ring focus:ring-primary-200 focus:ring-opacity-50 dark:border-gray-600 dark:bg-gray-700 dark:text-gray-300 dark:focus:ring-gray focus-within:text-primary-600 dark:focus-within:text-primary-400 dark:placeholder-gray-500 dark:focus:placeholder-gray-600 focus:placeholder-gray-300"
                        />
                        <i
                          class="absolute top-4 flex items-center ml-3 text-lg pointer-events-none fas fa-user"
                        ></i>
                      </div>
                      <div class="relative text-gray-500">
                        <input
                          type="number"
                          placeholder="EXP."
                          class="block w-full pl-10 mt-1 placeholder-gray-400 border-gray-300 rounded-md shadow-sm focus:border-primary-300 focus:ring focus:ring-primary-200 focus:ring-opacity-50 dark:border-gray-600 dark:bg-gray-700 dark:text-gray-300 dark:focus:ring-gray focus-within:text-primary-600 dark:focus-within:text-primary-400 dark:placeholder-gray-500 dark:focus:placeholder-gray-600 focus:placeholder-gray-300"
                        />
                        <i
                          class="absolute top-4 flex items-center ml-3 text-lg pointer-events-none fas fa-user"
                        ></i>
                      </div>
                      <div class="relative text-gray-500">
                        <input
                          type="number"
                          placeholder="CVV"
                          class="block w-full pl-10 mt-1 placeholder-gray-400 border-gray-300 rounded-md shadow-sm focus:border-primary-300 focus:ring focus:ring-primary-200 focus:ring-opacity-50 dark:border-gray-600 dark:bg-gray-700 dark:text-gray-300 dark:focus:ring-gray focus-within:text-primary-600 dark:focus-within:text-primary-400 dark:placeholder-gray-500 dark:focus:placeholder-gray-600 focus:placeholder-gray-300"
                        />
                        <i
                          class="absolute top-4 flex items-center ml-3 text-lg pointer-events-none fas fa-user"
                        ></i>
                      </div>
                    </div>
                    <div class="sm:col-span-2 grid sm:grid-cols-2 gap-6">
                      <div class="relative text-gray-500">
                        <input
                          type="text"
                          placeholder="Name of card holder"
                          class="block w-full pl-10 mt-1 placeholder-gray-400 border-gray-300 rounded-md shadow-sm focus:border-primary-300 focus:ring focus:ring-primary-200 focus:ring-opacity-50 dark:border-gray-600 dark:bg-gray-700 dark:text-gray-300 dark:focus:ring-gray focus-within:text-primary-600 dark:focus-within:text-primary-400 dark:placeholder-gray-500 dark:focus:placeholder-gray-600 focus:placeholder-gray-300"
                        />
                        <i
                          class="absolute top-4 flex items-center ml-3 text-lg pointer-events-none fas fa-user"
                        ></i>
                      </div>
                      <div class="relative text-gray-500">
                        <input
                          type="number"
                          placeholder="Postal code"
                          class="block w-full pl-10 mt-1 placeholder-gray-400 border-gray-300 rounded-md shadow-sm focus:border-primary-300 focus:ring focus:ring-primary-200 focus:ring-opacity-50 dark:border-gray-600 dark:bg-gray-700 dark:text-gray-300 dark:focus:ring-gray focus-within:text-primary-600 dark:focus-within:text-primary-400 dark:placeholder-gray-500 dark:focus:placeholder-gray-600 focus:placeholder-gray-300"
                        />
                        <i
                          class="absolute top-4 flex items-center ml-3 text-lg pointer-events-none fas fa-user"
                        ></i>
                      </div>
                    </div>
                  </div>
                </form>
              </div>
              <div class="lg:border-l lg:pl-8">
                <h3 class="text-xl font-bold text-gray-800 dark:text-gray-100">
                  Summary
                </h3>
                <ul class="text-gray-600 dark:text-gray-300 mt-6 space-y-4">
                  <li class="flex flex-wrap gap-4 text-sm">
                    Discount (20%)
                    <span class="ml-auto font-bold">$4.00</span>
                  </li>
                  <li class="flex flex-wrap gap-4 text-sm">
                    Tax <span class="ml-auto font-bold">$4.00</span>
                  </li>
                  <li
                    class="flex flex-wrap gap-4 text-base font-bold border-t pt-4 text-gray-800 dark:text-gray-100"
                  >
                    Total <span class="ml-auto">$52.00</span>
                  </li>
                </ul>
                <div
                  class="flex flex-wrap gap-4 mt-10 items-center justify-center"
                >
                  <button
                    type="button"
                    class="block px-4 py-2 mt-4 text-sm font-medium leading-5 text-center text-white transition-colors duration-150 bg-primary-600 border border-transparent rounded-lg active:bg-primary-600 hover:bg-primary-700 focus:outline-none focus:ring"
                    onclick="window.location.href = './';"
                  >
                    Cancel
                  </button>
                  <button
                    type="button"
                    class="block px-4 py-2 mt-4 text-sm font-medium leading-5 text-center text-white transition-colors duration-150 bg-primary-600 border border-transparent rounded-lg active:bg-primary-600 hover:bg-primary-700 focus:outline-none focus:ring"
                  >
                    Generate Invoice
                  </button>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <div id="footerContainer"></div>
    <script src="../assets/js/main/main.js"></script>
  </body>
